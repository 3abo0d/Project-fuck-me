
name: Native FluidGlass LSPosed - BUILD V4

on:
  workflow_dispatch:
  push:
    paths:
      - 'Native-FluidGlass-LSPosed-Source.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q Native-FluidGlass-LSPosed-Source.zip -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle
          test -f source/app/src/main/java/com/liquidglass/nativecc/FluidGlassEntry.java
          test -f source/app/src/main/assets/xposed_init

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f 2>/dev/null | head -50
            exit 1
          fi

          echo "Found SDK Manager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | bash "$SDKMANAGER" --licenses || true

      - name: Install Android packages
        shell: bash
        run: |
          bash "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile APK
        working-directory: source
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK contents
        shell: bash
        run: |
          APK="source/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "===== APK FILE SIZE ====="
          ls -lh "$APK"

          echo "===== APK CONTENTS ====="
          unzip -l "$APK"

          echo "===== APK INTEGRITY ====="
          unzip -t "$APK"

          echo "===== CHECK REQUIRED FILES ====="
          unzip -l "$APK" | grep -E 'classes.dex|assets/xposed_init|AndroidManifest.xml'

          unzip -l "$APK" | grep -q 'classes.dex' || {
            echo "ERROR: classes.dex is missing. Java code was not packaged."
            exit 1
          }

          unzip -l "$APK" | grep -q 'assets/xposed_init' || {
            echo "ERROR: LSPosed entry file is missing."
            exit 1
          }

          echo "APK passed the basic packaging checks."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Native-FluidGlass-LSPosed-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
