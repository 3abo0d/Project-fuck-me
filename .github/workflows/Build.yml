
name: Build Native FluidGlass LSPosed APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Native-FluidGlass-LSPosed-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q Native-FluidGlass-LSPosed-Source.zip -d source
          ls -la source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Native-FluidGlass-LSPosed-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
