
name: Native FluidGlass LSPosed - BUILD V5

on:
  workflow_dispatch:
  push:
    paths:
      - 'Native-FluidGlass-LSPosed-Source.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q Native-FluidGlass-LSPosed-Source.zip -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle
          test -f source/app/src/main/java/com/liquidglass/nativecc/FluidGlassEntry.java
          test -f source/app/src/main/assets/xposed_init

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          yes | bash "$SDKMANAGER" --licenses || true

      - name: Install Android packages
        run: |
          bash "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile APK
        working-directory: source
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Deep APK inspection
        shell: bash
        run: |
          APK="source/app/build/outputs/apk/debug/app-debug.apk"

          echo "===== APK SIZE ====="
          ls -lh "$APK"
          stat "$APK"

          echo "===== ZIP CONTENTS ====="
          unzip -l "$APK"

          echo "===== DEX FILE DETAILS ====="
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          ls -lh /tmp/classes.dex
          file /tmp/classes.dex

          echo "===== DEX HEADER ====="
          xxd -l 112 /tmp/classes.dex

          echo "===== DEX CLASSES ====="
          "$ANDROID_HOME/build-tools/36.0.0/dexdump" /tmp/classes.dex | head -100

          echo "===== LSPOSED ENTRY ====="
          unzip -p "$APK" assets/xposed_init

          echo "===== APK INTEGRITY ====="
          unzip -t "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Native-FluidGlass-LSPosed-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
